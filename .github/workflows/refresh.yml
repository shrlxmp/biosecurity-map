name: Refresh map from biosecurity.world

# Rebuilds index.html from the upstream dataset and commits it only if
# something actually changed. GitHub Pages redeploys on its own after a push.
on:
  schedule:
    # Mondays, 06:20 UTC. biosecurity.world refreshes weekly, so this picks up
    # their changes shortly after. GitHub may delay scheduled runs under load.
    - cron: "20 6 * * 1"
  workflow_dispatch: # adds a "Run workflow" button for refreshing on demand

permissions:
  contents: write # needed to push the rebuilt index.html back to the repo

concurrency:
  group: refresh-map
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the latest dataset and rebuild
        # build.py validates the download before overwriting entries.csv, so a
        # moved URL or an error page fails the run instead of publishing an
        # empty map
        run: python build/build.py --refresh

      - name: Fetch the latest Coefficient Giving biosecurity grants
        # reads Trace's export of the grants database; validated before
        # build/funding_cg.json is overwritten, and a no-op when nothing changed.
        # If Trace is unreachable the map still refreshes, using the last
        # committed grants, and the run shows a warning for this step.
        continue-on-error: true
        run: python build/fetch_funding.py

      - name: Fetch logos for any newly listed organisations
        # incremental: only reaches out for domains not already cached
        run: python build/fetch_logos.py

      - name: Rebuild so any new logos and grants are inlined
        run: python build/build.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet; then
            echo "No upstream changes - nothing to commit."
            exit 0
          fi

          orgs=$(python -c "import csv,io;print(sum(1 for _ in csv.DictReader(io.open('build/entries.csv',encoding='utf-8'))))")
          echo "Changed files:"
          git diff --stat

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh map from biosecurity.world ($orgs entries)" \
                     -m "Automated weekly rebuild. Source: https://biosecurity.world/data/entries.csv"
          git push
